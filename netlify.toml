[build]
  command = "npm ci && npm --prefix client ci && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The built client loads no inline script and no third-party origin, so the policy
# can stay closed. connect-src is 'self' because the API is on the same origin.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()"

# Nothing under /api may be cached by a browser or by anything in front of it.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The service worker must never be served stale, or a phone keeps an old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The API function declares its own path via `export const config`. The SPA
# fallback must stay last so it never shadows /api/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
